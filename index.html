<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Troop Training Calculator</title>

<style>
body{
    font-family:system-ui,Arial,sans-serif;
    background:#0f172a;
    color:white;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
}

.row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
}

input{
    width:80px;
    padding:12px;
    border:none;
    border-radius:10px;
    text-align:center;
    font-size:18px;
}

h1{
    text-align:center;
}

.result{
    font-size:22px;
    color:#22c55e;
    font-weight:bold;
}

.label{
    font-weight:bold;
}
</style>
</head>

<body>

<h1>Troop Training Calculator</h1>

<div class="card">
    <div class="label">Current Local Time</div>
    <div id="localTime"></div>
    <br>

    <div class="label">Current UTC Time</div>
    <div id="utcTime"></div>
</div>

<div class="card">
    <h2>Training Duration</h2>

    <div class="row">
        Days
        <input id="days" type="number" value="0" min="0">

        Hours
        <input id="hours" type="number" value="0" min="0">

        Minutes
        <input id="minutes" type="number" value="0" min="0">

        Seconds
        <input id="seconds" type="number" value="0" min="0">
    </div>
</div>

<div class="card">
    <h2>Results</h2>

    <p>
        <span class="label">Start Time</span><br>
        <span id="startTime"></span>
    </p>

    <p>
        <span class="label">Finish Time</span><br>
        <span id="finishTime" class="result"></span>
    </p>

    <p>
        <span class="label">Training Duration</span><br>
        <span id="durationDisplay"></span>
    </p>
</div>

<script>

function updateCalculator(){

    const now = new Date();

    document.getElementById("localTime").textContent =
        now.toLocaleString();

    document.getElementById("utcTime").textContent =
        now.toUTCString();

    const days =
        Number(document.getElementById("days").value) || 0;

    const hours =
        Number(document.getElementById("hours").value) || 0;

    const minutes =
        Number(document.getElementById("minutes").value) || 0;

    const seconds =
        Number(document.getElementById("seconds").value) || 0;

    const totalMs =
        (
            days * 86400 +
            hours * 3600 +
            minutes * 60 +
            seconds
        ) * 1000;

    const finish =
        new Date(now.getTime() + totalMs);

    document.getElementById("startTime").textContent =
        now.toLocaleString();

    document.getElementById("finishTime").textContent =
        finish.toLocaleString();

    document.getElementById("durationDisplay").textContent =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

document.querySelectorAll("input").forEach(input=>{
    input.addEventListener("input", updateCalculator);
});

setInterval(updateCalculator,1000);

updateCalculator();

</script>

</body>
</html>
