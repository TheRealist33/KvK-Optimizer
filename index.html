<script>
let days = 0;
let hours = 0;
let minutes = 0;
let seconds = 0;

function chg(id, value) {
    if (id === "days") days = Math.max(0, days + value);
    if (id === "hours") hours = Math.max(0, hours + value);
    if (id === "minutes") minutes = Math.max(0, minutes + value);
    if (id === "seconds") seconds = Math.max(0, seconds + value);

    document.getElementById("daysView").textContent = days;
    document.getElementById("hoursView").textContent = hours;
    document.getElementById("minutesView").textContent = minutes;
    document.getElementById("secondsView").textContent = seconds;

    calc();
}

function calc() {

    const localEl = document.getElementById("local");
    const utcEl = document.getElementById("utc");
    const resetEl = document.getElementById("reset");

    const startNowEl = document.getElementById("startNow");
    const finishNowEl = document.getElementById("finishNow");

    const desiredEl = document.getElementById("desired");
    const requiredEl = document.getElementById("required");
    const untilEl = document.getElementById("until");
    const statusEl = document.getElementById("status");

    const landingDateEl = document.getElementById("landingDate");
    const landingTimeEl = document.getElementById("landingTime");

    const now = new Date();

    localEl.textContent = now.toLocaleString();

    utcEl.textContent = now.toUTCString();

    const nextReset = new Date();
    nextReset.setUTCHours(24, 0, 0, 0);

    const resetDiff = nextReset - now;

    const resetHours = Math.floor(resetDiff / 3600000);
    const resetMinutes = Math.floor((resetDiff % 3600000) / 60000);
    const resetSeconds = Math.floor((resetDiff % 60000) / 1000);

    resetEl.textContent =
        `${resetHours}h ${resetMinutes}m ${resetSeconds}s`;

    const durationMs =
        (
            days * 86400 +
            hours * 3600 +
            minutes * 60 +
            seconds
        ) * 1000;

    startNowEl.textContent =
        now.toLocaleString();

    finishNowEl.textContent =
        new Date(now.getTime() + durationMs).toLocaleString();

    if (landingDateEl.value) {

        const target =
            new Date(
                landingDateEl.value +
                "T" +
                (landingTimeEl.value || "00:00") +
                ":00"
            );

        desiredEl.textContent =
            target.toLocaleString();

        const requiredStart =
            new Date(
                target.getTime() - durationMs
            );

        requiredEl.textContent =
            requiredStart.toLocaleString();

        let diff =
            requiredStart - now;

        if (diff <= 0) {

            untilEl.textContent =
                "0d 0h 0m 0s";

            statusEl.textContent =
                "START NOW";

            statusEl.style.background =
                "#22C55E";

            statusEl.style.color =
                "#04150A";

        } else {

            const totalSeconds =
                Math.floor(diff / 1000);

            const d =
                Math.floor(totalSeconds / 86400);

            const h =
                Math.floor(
                    (totalSeconds % 86400) / 3600
                );

            const m =
                Math.floor(
                    (totalSeconds % 3600) / 60
                );

            const s =
                totalSeconds % 60;

            untilEl.textContent =
                `${d}d ${h}h ${m}m ${s}s`;

            statusEl.textContent =
                "WAIT TO START";

            statusEl.style.background =
                "#38BDF8";

            statusEl.style.color =
                "#00111F";
        }

    } else {

        desiredEl.textContent = "Select Date";
        requiredEl.textContent = "--";
        untilEl.textContent = "--";
    }
}

document.getElementById("landingDate").addEventListener("input", calc);
document.getElementById("landingTime").addEventListener("input", calc);

setInterval(calc, 1000);

calc();
</script>
